version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hundred_to_one_db
    environment:
      POSTGRES_DB: hundred_to_one
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d hundred_to_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: